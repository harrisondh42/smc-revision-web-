<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="11-week SMC to BMO1 training plan for Harrison and Sejun.">
<title>SMC Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..400&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   SMC Trainer — design tokens
   Transcribed from claude_design_smc.md §1. Values are exact; do not round.
   ========================================================================= */
:root{
  /* Palette — §1 "use exactly". No green/orange/yellow/red anywhere. */
  --ink:      #0f1012;   /* primary text, dark bands, solid fills */
  --black:    #020201;   /* emphasis */
  --canvas:   #f2f2f4;   /* page canvas */
  --surface:  #fdfdfd;   /* elevated surfaces */
  --steel:    #5e5e5e;   /* muted text */
  --ash:      #8f8f8f;   /* disabled, tertiary */
  --blue:     #0071e3;   /* links, interactive borders, "outside help was used" */
  --hair:     rgba(0,0,0,0.06);

  /* Spacing — §1 Departure 1. In-app scale only. */
  --s4:4px; --s6:6px; --s10:10px; --s11:11px; --s22:22px;
  --s30:30px; --s34:34px; --s50:50px;
  /* Reserved for login + session runner only */
  --s69:69px; --s94:94px; --s113:113px; --s130:130px; --s144:144px; --s220:220px;

  /* Radii — scale with the element */
  --r-panel:54px;   /* login card, session runner panel */
  --r-card:26px;    /* content cards, filled buttons */
  --r-row:10px;     /* list rows, table cells, nav pill */
  --r-pill:9999px;  /* tags, chips, state pills */
}

/* Typography — §1. Weight 350 for everything; 400 only under 13px.
   Hierarchy comes from size, never weight. Letter-spacing -0.02em uniformly. */
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  font-weight:350;
  font-size:14px;
  line-height:1.45;
  letter-spacing:-0.02em;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,p,ul,ol,figure{margin:0;padding:0;}
ul,ol{list-style:none;}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;}
a{color:var(--blue);text-decoration:none;}
a:hover{text-decoration:underline;}
input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit;}

/* Size scale — 10, 12, 13, 14, 16, 18, 27, plus the 54 display (Departure 2) */
.t10{font-size:10px;font-weight:400;}
.t12{font-size:12px;font-weight:400;}
.t13{font-size:13px;}
.t14{font-size:14px;}
.t16{font-size:16px;}
.t18{font-size:18px;}
.t27{font-size:27px;}
.display{font-size:54px;font-weight:350;letter-spacing:-1.08px;line-height:1.02;}

.muted{color:var(--steel);}
.tertiary{color:var(--ash);}
.caps{text-transform:uppercase;letter-spacing:0.06em;}
.tnum{font-variant-numeric:tabular-nums;}

/* Elevation — §1: no drop shadows. #fdfdfd on #f2f2f4 plus 0.5px hairlines. */
.surface{background:var(--surface);border:0.5px solid var(--hair);}

/* ---- Buttons -------------------------------------------------------------
   §1 Departure 2: exactly one filled primary action per screen.
   Everything else is a ghost or a blue text link. -------------------------- */
.btn-primary{
  background:var(--ink);color:var(--surface);
  border-radius:var(--r-card);
  padding:var(--s11) var(--s30);
  font-size:16px;font-weight:350;
  border:0.5px solid var(--ink);
  transition:opacity .12s ease;
}
.btn-primary:hover{opacity:.86;}
.btn-primary:disabled{background:var(--ash);border-color:var(--ash);cursor:not-allowed;opacity:1;}
.btn-ghost{
  background:var(--surface);color:var(--ink);
  border:0.5px solid var(--hair);
  border-radius:var(--r-card);
  padding:var(--s11) var(--s22);
  font-size:14px;
  transition:border-color .12s ease;
}
.btn-ghost:hover{border-color:var(--blue);}
.btn-ghost:disabled{color:var(--ash);cursor:not-allowed;border-color:var(--hair);}
.btn-link{color:var(--blue);font-size:13px;}
.btn-link:hover{text-decoration:underline;}
.btn-link:disabled{color:var(--ash);cursor:not-allowed;text-decoration:none;}

/* ---- Pills and chips ----------------------------------------------------- */
.pill{
  display:inline-flex;align-items:center;gap:var(--s4);
  border-radius:var(--r-pill);
  padding:2px var(--s10);
  font-size:10px;font-weight:400;
  border:0.5px solid var(--hair);
  white-space:nowrap;
}
.pill-solid{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.pill-steel{background:var(--steel);color:var(--surface);border-color:var(--steel);}
.pill-blue{border-color:var(--blue);color:var(--blue);}
.pill-blue-edge{background:var(--ink);color:var(--surface);border-color:var(--blue);}
.pill-out{color:var(--ash);}
.pill-12{font-size:12px;padding:3px var(--s10);}

/* ---- Layout -------------------------------------------------------------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--s22);}
.screen{padding-top:var(--s94);padding-bottom:var(--s130);}
.stack-6 >*+*{margin-top:var(--s6);}
.stack-10>*+*{margin-top:var(--s10);}
.stack-22>*+*{margin-top:var(--s22);}
.stack-30>*+*{margin-top:var(--s30);}
.stack-50>*+*{margin-top:var(--s50);}
.row{display:flex;align-items:center;gap:var(--s10);}
.between{display:flex;align-items:center;justify-content:space-between;gap:var(--s22);}
.card{background:var(--surface);border:0.5px solid var(--hair);border-radius:var(--r-card);padding:var(--s34);}
.rule{height:0;border-top:0.5px solid var(--hair);}

/* ---- Nav (§2) — floating pill, 34px from top, centred -------------------- */
#nav{position:sticky;top:var(--s34);z-index:60;display:flex;justify-content:center;padding:0 var(--s22);}
.navpill{
  display:flex;align-items:center;gap:var(--s22);
  background:var(--surface);border:0.5px solid var(--hair);
  border-radius:var(--r-row);
  padding:var(--s11) var(--s22);
  max-width:100%;
}
.navlinks{display:flex;align-items:center;gap:var(--s22);}
.navlink{font-size:16px;font-weight:350;color:var(--steel);background:none;transition:color .12s ease;}
.navlink:hover{color:var(--ink);}
.navlink[aria-current="page"]{color:var(--ink);}
.navtail{display:flex;align-items:center;gap:var(--s10);margin-left:var(--s22);}
.chip{
  display:inline-flex;align-items:center;gap:var(--s6);
  border:0.5px solid var(--hair);border-radius:var(--r-pill);
  padding:var(--s4) var(--s11);
  background:var(--surface);
}
.chip:hover{border-color:var(--blue);}
.userchip{
  width:30px;height:30px;padding:0;justify-content:center;
  border-radius:var(--r-pill);background:var(--ink);color:var(--surface);
  font-size:12px;font-weight:400;border-color:var(--ink);
}

/* ---- Difficulty meter (§3.5) — 5 hairline segments ----------------------- */
.meter{display:inline-flex;gap:3px;align-items:center;}
.seg{width:9px;height:9px;border:0.5px solid var(--ash);border-radius:2px;}
.seg.on{background:var(--ink);border-color:var(--ink);}

/* ---- Tables / list rows -------------------------------------------------- */
.lrow{
  display:grid;align-items:center;gap:var(--s10);
  padding:var(--s10) var(--s22);
  border-radius:var(--r-row);
  background:var(--surface);border:0.5px solid var(--hair);
}
.lrow.blackout{background:transparent;border-style:dashed;color:var(--ash);}
.lrow.blackout .ltitle{text-decoration:line-through;}
.hrow{
  display:grid;gap:var(--s10);
  padding:0 var(--s22) var(--s6);
  font-size:10px;font-weight:400;color:var(--ash);
  text-transform:uppercase;letter-spacing:0.06em;
}

/* Exam day — full-width dark band (§3.3) */
.band{
  background:var(--ink);color:var(--surface);
  border-radius:var(--r-row);
  padding:var(--s22);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s22);
}
.band .tertiary{color:rgba(253,253,253,.62);}

/* Phase boundary — full-width hairline rule with a 12px label (§3.3) */
.phase{display:flex;align-items:center;gap:var(--s10);padding:var(--s22) 0 var(--s10);}
.phase .rule{flex:1;}
.phase span{font-size:12px;font-weight:400;color:var(--ash);white-space:nowrap;}

/* ---- Focus ring ---------------------------------------------------------- */
:focus-visible{outline:1.5px solid var(--blue);outline-offset:2px;border-radius:2px;}

/* ---- Utility ------------------------------------------------------------- */
.grid-2{display:grid;grid-template-columns:1fr 340px;gap:var(--s30);align-items:start;}
.hidden{display:none !important;}
.scrollx{overflow-x:auto;}
.wfull{width:100%;}

/* ============================================================================
   Login (§3.1) and Session runner (§3.4)
   The two screens that keep full Augen Pro scale. Large spacing values are
   permitted here and nowhere else.
   ========================================================================= */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s69) var(--s22);}
.logincard{
  width:100%;max-width:620px;text-align:center;
  background:var(--surface);border:0.5px solid var(--hair);
  border-radius:var(--r-panel);
  padding:var(--s130) var(--s69);
}
.star{display:block;margin:0 auto var(--s50);}
.loginbtns{display:flex;gap:var(--s22);justify-content:center;margin-top:var(--s94);}
.loginbtn{
  background:var(--surface);border:0.5px solid var(--hair);
  border-radius:var(--r-card);
  padding:var(--s22) var(--s69);
  font-size:16px;font-weight:350;
  transition:border-color .12s ease;
}
.loginbtn:hover{border-color:var(--blue);}
.logincap{margin-top:var(--s50);}

#runner{position:fixed;inset:0;z-index:100;background:var(--canvas);overflow-y:auto;display:flex;flex-direction:column;}
.runnertop{display:flex;justify-content:space-between;align-items:center;padding:var(--s30) var(--s50);}
.runnerbody{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--s69) var(--s22);}
.runnerpanel{width:100%;max-width:700px;text-align:center;}
.runnerfoot{padding:var(--s50);}
.segbar{display:flex;gap:var(--s6);justify-content:center;}
.segbar div{height:3px;flex:1;max-width:80px;border:0.5px solid var(--ash);border-radius:var(--r-pill);}
.segbar div.done{background:var(--ink);border-color:var(--ink);}
.segbar div.current{background:var(--steel);border-color:var(--steel);}
.runneractions{display:flex;gap:var(--s22);justify-content:center;align-items:center;margin-top:var(--s94);}

/* Attempt clock (§3.4) — the hint control stays VISIBLE but disabled,
   counting down, so the student can see they are meant to keep struggling. */
.attempt{
  margin-top:var(--s50);padding:var(--s22);
  border:0.5px solid var(--hair);border-radius:var(--r-card);
  background:var(--surface);
}

/* ---- Proofs (§3.6) — two panes, no colour-coding of marks --------------- */
.proofgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s30);align-items:start;}
.rubric-item{padding:var(--s22) 0;border-top:0.5px solid var(--hair);}
.rubric-item:first-child{border-top:none;}
textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--canvas);
  border:0.5px solid var(--hair);border-radius:var(--r-row);
  padding:var(--s10) var(--s11);font-size:13px;
}
textarea{min-height:90px;resize:vertical;line-height:1.5;}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--blue);}
.tri{display:flex;gap:var(--s6);}
.tri button{
  flex:1;border:0.5px solid var(--hair);border-radius:var(--r-row);
  padding:var(--s6) var(--s10);font-size:12px;font-weight:400;color:var(--steel);
  background:var(--surface);
}
.tri button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);}

/* ---- Progress (§3.9) — hairline stroke, no fill, no gridlines ----------- */
.chart{width:100%;height:auto;display:block;}
.chart .stroke{fill:none;stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;}
.chart .axis{stroke:var(--hair);stroke-width:1;vector-effect:non-scaling-stroke;}
.chart .dot{fill:var(--surface);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke;}
.chart .ghost{fill:none;stroke:var(--ash);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke;}
.bar{height:var(--s10);border-radius:var(--r-pill);background:var(--canvas);border:0.5px solid var(--hair);overflow:hidden;}
.bar i{display:block;height:100%;background:var(--ink);}

/* ---- Filters ------------------------------------------------------------- */
.filters{display:flex;flex-wrap:wrap;gap:var(--s6);}
.fchip{
  border:0.5px solid var(--hair);border-radius:var(--r-pill);
  padding:var(--s4) var(--s11);font-size:12px;font-weight:400;
  color:var(--steel);background:var(--surface);
}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);}

/* ---- Drawer (user chip → Progress + Techniques, §2) --------------------- */
#drawer{position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end;background:rgba(15,16,18,.14);}
.drawerpanel{
  width:min(720px,100%);background:var(--canvas);
  height:100%;overflow-y:auto;padding:var(--s50) var(--s34);
  border-left:0.5px solid var(--hair);
}

/* ---- Responsive — brief says laptop-first, responsive but not phone-tuned */
@media (max-width:1000px){
  .grid-2,.proofgrid{grid-template-columns:1fr;}
  .navpill{flex-wrap:wrap;justify-content:center;gap:var(--s10);}
  .navtail{margin-left:0;}
  .logincard{padding:var(--s69) var(--s30);}
  .screen{padding-top:var(--s69);}
}
@media (max-width:640px){
  .navlinks{gap:var(--s11);}
  .navlink{font-size:14px;}
  .display{font-size:40px;letter-spacing:-0.8px;}
  .loginbtns{flex-direction:column;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important;}
}

/* ============================================================================
   MOTION — see the motion brief.
   One curve, one duration band (280-620ms). Nothing over 700ms except the
   guide figures, which loop because they are teaching diagrams.
   No decorative motion: every animation either explains a rule of the plan
   or confirms a state change the user caused.
   ========================================================================= */
:root{ --ease:cubic-bezier(.34, 1.4, .64, 1); --dur:280ms; }

.btn-primary,.btn-ghost,.btn-link,.pill,.fchip,.chip,.lrow,.tri button,.loginbtn,.navlink,.seg,.bar i{
  transition: color var(--dur) var(--ease),
              background-color var(--dur) var(--ease),
              border-color var(--dur) var(--ease),
              opacity var(--dur) var(--ease),
              transform var(--dur) var(--ease);
}
.btn-primary:active,.btn-ghost:active,.loginbtn:active{transform:scale(.975);}

/* Nav — active underline scales in from the left over 420ms. */
.navlink{position:relative;}
.navlink::after{
  content:"";position:absolute;left:0;right:0;bottom:-3px;height:1.5px;
  background:var(--ink);border-radius:var(--r-pill);
  transform:scaleX(0);transform-origin:left center;
  transition:transform 420ms var(--ease);
}
.navlink[aria-current="page"]::after{transform:scaleX(1);}

/* Lists — rows rise 10px and fade in, staggered 22ms, capped at 12 rows.
   Past twelve the stagger reads as lag, not sequence. Applied on navigation
   only, never on an in-place re-render. */
@keyframes rowIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.enter{animation:rowIn 420ms var(--ease) both;}

/* Progress — logged-hours bar grows from the baseline. */
.bar i{transition:width 620ms var(--ease);}

/* Mock sparkline — own line draws itself; the other student's dashed line
   fades in 200ms later. Own performance first, comparison second. */
@keyframes drawIn{to{stroke-dashoffset:0;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.chart .stroke.draw{animation:drawIn 620ms var(--ease) both;}
.chart .ghost.late{animation:fadeIn 200ms linear 200ms both;}

/* Session runner — a 72px ring depletes over the block's minimum attempt
   time. The clock and the ring say the same thing two ways. */
.attemptring{width:72px;height:72px;flex:none;}
.attemptring circle{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;}
.attemptring .track{stroke:var(--hair);}
.attemptring .run{stroke:var(--ink);transition:stroke-dashoffset 1s linear, stroke 280ms var(--ease);}
.attemptring .run.open{stroke:var(--blue);}

/* ---- Kinetic figures ----------------------------------------------------- */
.figure{width:100%;display:block;}
.figure text{font-family:inherit;letter-spacing:-0.02em;}

/* ---- First-run guide ----------------------------------------------------- */
#guide{
  position:fixed;inset:0;z-index:120;background:var(--canvas);
  display:flex;flex-direction:column;overflow-y:auto;
}
.guidebody{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--s69) var(--s50);}
.guideinner{
  width:100%;max-width:820px;
  display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:var(--s50);align-items:center;
}
.guidefig{width:260px;}
/* The motion brief specifies 2px here. The base visual system uses 0.5px
   hairlines everywhere; this is the one deliberate exception. */
.guidefoot{border-top:2px solid var(--hair);padding:var(--s30) var(--s50);}
.guidedots{display:flex;gap:var(--s6);}
.guidedots button{
  width:9px;height:9px;border-radius:var(--r-pill);
  border:0.5px solid var(--ash);background:transparent;
  transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),transform var(--dur) var(--ease);
}
.guidedots button.on{background:var(--ink);border-color:var(--ink);}
.guidedots button.now{transform:scale(1.35);}
@keyframes stepIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.guidestep{animation:stepIn 420ms var(--ease) both;}

@media (max-width:820px){
  .guideinner{grid-template-columns:1fr;gap:var(--s34);}
  .guidefig{width:220px;margin:0 auto;}
  .guidebody{padding:var(--s50) var(--s22);}
  .guidefoot{padding:var(--s22);}
}

/* Reduced motion — figures render their settled end state, not a frozen
   mid-frame, and everything else simply stops. */
@media (prefers-reduced-motion:reduce){
  .navlink::after{transition:none;}
  .enter{animation:none;}
  .chart .stroke.draw,.chart .ghost.late{animation:none;stroke-dashoffset:0;opacity:1;}
  .attemptring .run{transition:none;}
}
</style>
</head>

<!-- ==========================================================================
     Login (§3.1)
     ======================================================================= -->
<div id="login">
  <div class="logincard">
    <svg class="star" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
      <path d="M23 0 L26.4 19.6 L46 23 L26.4 26.4 L23 46 L19.6 26.4 L0 23 L19.6 19.6 Z" fill="#0f1012"/>
    </svg>
    <h1 class="t27">SMC Trainer</h1>
    <div class="loginbtns">
      <button class="loginbtn" data-user="harrison">Harrison</button>
      <button class="loginbtn" data-user="sejun">Sejun</button>

  </div>
</div>

<!-- ==========================================================================
     App
     ======================================================================= -->

</div>

<div id="drawer" class="hidden"><div class="drawerpanel" id="drawerBody"></div></div>
<div id="runner" class="hidden"></div>
<div id="guide" class="hidden"></div>

<script>
"use strict";
/* ============================================================================
   DATA LAYER
   Transcribed from smc-bmo1-plan.md (v2, 3 Sep 2026) and resources.md.
   Session IDs S001-S068, techniques T01-T17, resources R01-R31, problems
   P01-P12 are stable per plan §14. Dates are 2026.
   ========================================================================= */

const EXAMS = {
  smc:      {date:"2026-10-07", name:"Senior Mathematical Challenge",
             detail:"90 min · 22 multiple choice + 3 answered 000-999"},
  bmo1:     {date:"2026-11-18", name:"British Mathematical Olympiad Round 1",
             detail:"3.5 h · six problems · 10 marks each"},
  kangaroo: {date:"2026-11-18", name:"Andrew Jobbings Senior Kangaroo",
             detail:"60 min · 20 questions · answers 000-999"}
};

/* Blackouts — plan §9. Weekends 5-6, 12-13, 19-20 Sep; exeat Fri 18 Sep. */
const BLACKOUTS = {
  "2026-09-05":"Weekend — school", "2026-09-06":"Weekend — school",
  "2026-09-12":"Weekend — school", "2026-09-13":"Weekend — school",
  "2026-09-18":"Exeat",
  "2026-09-19":"Weekend — school", "2026-09-20":"Weekend — school"
};

/* Phase boundaries — plan §5. Rendered as hairline rules in the agenda. */
const PHASES = [
  {start:"2026-09-03", label:"Phase 0 — Diagnostic"},
  {start:"2026-09-07", label:"Phase 1 — SMC primary, proof secondary"},
  {start:"2026-10-08", label:"Phase 2a — Content, outcome-agnostic"},
  {start:"2026-10-26", label:"Phase 2b — Committed"}
];

const WEEKS = [
  {n:0, start:"2026-09-03", end:"2026-09-06", theme:"Diagnostic",
   checkpoint:"Baseline SMC + error taxonomy"},

/* ============================================================================
   STATE + PERSISTENCE
   Brief §6 asked for `window.storage` with `shared:true`. That API does not
   exist. The real primitive for shared, server-side, hierarchically-keyed
   state is the `db` capability: await claude.use("db"). It resolves null
   when unavailable, in which case the app runs on an in-memory store and
   says so — it never silently pretends to have saved.
   localStorage / sessionStorage are deliberately NOT used, per brief §6.
   Writes are batched: one debounced document write per student, not per item.
   ========================================================================= */
const USERS = {harrison:{name:"Harrison", initial:"H"}, sejun:{name:"Sejun", initial:"S"}};
const UID = ["harrison","sejun"];

const blankStudent = () => ({sessions:{}, techniques:{}, problems:{}, mocks:{}, hours:{}, guideSeen:false});
const blankShared  = () => ({branch:"awaiting", proofs:[]});

const State = {
  me:null,
  student:{harrison:blankStudent(), sejun:blankStudent()},
  shared:blankShared(),
  db:null,
  mode:"memory",            // "db" | "memory"
  _timers:{},
  _subs:[]
};

async function initStore(){
  let db=null;
  try{ db = await claude.use("db"); }catch(_){ db=null; }
  if(!db) return;                                  // in-memory; UI reflects it
  State.db=db; State.mode="db";
  const load = async (path, fallback) => {
    try{ const s = await db.doc(path).get(); return s.exists ? s.data() : fallback; }
    catch(_){ return fallback; }
  };
  const [h,s,sh] = await Promise.all([
    load("state/harrison", blankStudent()),
    load("state/sejun",    blankStudent()),
    load("state/shared",   blankShared())
  ]);
  State.student.harrison = Object.assign(blankStudent(), h);
  State.student.sejun    = Object.assign(blankStudent(), s);
  State.shared           = Object.assign(blankShared(), sh);

  // Live sync — the brief wants each student to see the other's progress.
  const watch = (path, apply) => {
    try{
      State._subs.push(db.doc(path).onSnapshot(
        snap => { if(snap.exists && !snap.metadata.hasPendingWrites){ apply(snap.data()); render(); } },
        _err => {}                                  // degrade quietly; store still readable
      ));
    }catch(_){}
  };
  watch("state/harrison", d => State.student.harrison = Object.assign(blankStudent(), d));
  watch("state/sejun",    d => State.student.sejun    = Object.assign(blankStudent(), d));
  watch("state/shared",   d => State.shared           = Object.assign(blankShared(), d));
  render();
}

/* Batched write — coalesces rapid edits into one document write per key. */
function persist(key){
  if(State.mode!=="db") return;
  clearTimeout(State._timers[key]);
  State._timers[key]=setTimeout(async ()=>{
    const path = key==="shared" ? "state/shared" : "state/"+key;
    const body = key==="shared" ? State.shared : State.student[key];
    try{ await State.db.doc(path).set(JSON.parse(JSON.stringify(body))); }
    catch(e){ if(e && e.code==="unavailable"){ setTimeout(()=>persist(key), 1200+Math.random()*800); } }
  }, 450);
}
const saveMe     = () => persist(State.me);
const saveShared = () => persist("shared");

/* ============================================================================
   HELPERS
   ========================================================================= */
const $  = (s,r)=> (r||document).querySelector(s);
const el = (t,c,txt)=>{const n=document.createElement(t); if(c)n.className=c; if(txt!=null)n.textContent=txt; return n;};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const DAY = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Parse as LOCAL midnight, not UTC — new Date("2026-09-07") is UTC and shifts
   the weekday for anyone west of Greenwich. */
function d(iso){const [y,m,dd]=iso.split("-").map(Number); return new Date(y,m-1,dd);}
function fmt(iso){const x=d(iso); return x.getDate()+" "+MON[x.getMonth()];}
function fmtLong(iso){const x=d(iso); return DAY[x.getDay()]+" "+x.getDate()+" "+MON[x.getMonth()];}
function dow(iso){return DAY[d(iso).getDay()];}
function todayISO(){const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");}
function daysBetween(a,b){return Math.round((d(b)-d(a))/86400000);}
function plural(n,w){return n+" "+w+(n===1?"":"s");}
function hhmm(sec){const m=Math.floor(Math.abs(sec)/60), s=Math.abs(sec)%60; return (sec<0?"-":"")+m+":"+String(s).padStart(2,"0");}

const byId    = (arr,id)=>arr.find(x=>x.id===id);
const session = id=>byId(SESSIONS,id);
const tech    = id=>byId(TECHNIQUES,id);
const res     = id=>byId(RESOURCES,id);
const prob    = id=>byId(PROBLEMS,id);
const other   = u=> u==="harrison" ? "sejun" : "harrison";

const sessionOn   = iso => SESSIONS.filter(s=>s.date===iso);
const sessStatus  = (u,id) => (State.student[u].sessions[id]||{}).status || "not-started";
const weekOf      = n => WEEKS.find(w=>w.n===n);

/* Which paper is being sat on 18 Nov — a first-class state, not an
   afterthought (plan §14). Both fall on the same day; only one can be sat. */
function branch(){return State.shared.branch;}
function targetExam(){
  const b=branch();
  return b==="kangaroo" ? EXAMS.kangaroo : EXAMS.bmo1;   // "awaiting" shows BMO1 as the aim
}
function nextExam(){
  const t=todayISO();
  return daysBetween(t, EXAMS.smc.date) >= 0 ? EXAMS.smc : targetExam();
}

/* Technique state — brief §3.7. Overdue is the only state that draws the eye. */
function techState(u,tid){
  const T=tech(tid), t=todayISO(), rec=State.student[u].techniques[tid]||{};
  if(daysBetween(t,T.taught)>0) return "not yet taught";
  const pending = T.reviews.filter(r=>!(rec.done||[]).includes(r));
  if(!pending.length) return "reviewed";
  const soonest = pending[0], gap = daysBetween(t, soonest);
  if(gap < 0)  return "overdue";
  if(gap === 0) return "due";
  return "scheduled";
}
function techDueToday(u){
  const t=todayISO();
  return TECHNIQUES.filter(T=>{
    const st=techState(u,T.id);
    return (st==="due"||st==="overdue") && daysBetween(t,T.taught)<=0;
  });
}

/* Problem state, per student. Paper-level plus per-question. */
function pState(u,pid,q){
  const rec = State.student[u].problems[pid]||{};
  if(q==null) return rec.state || "unattempted";
  return (rec.q||{})[q] || "unattempted";
}
function setPState(u,pid,q,v){
  const P=State.student[u].problems, rec = P[pid] || (P[pid]={state:"unattempted",q:{}});
  if(q==null) rec.state=v; else { rec.q=rec.q||{}; rec.q[q]=v; }
  saveMe();
}

/* ============================================================================
   SHARED FRAGMENTS
   ========================================================================= */
function modePill(mode){
  if(mode==="rest") return '<span class="pill">rest</span>';
  return '<span class="pill'+(mode==="paired"?" pill-solid":"")+'">'+mode+'</span>';
}
/* Two-user marking (§4): fixed position, H always left, S always right.
   Never distinguished by colour. */
function hsChips(get){
  return UID.map(u=>{
    const v=get(u), on = v==="done"||v==="solved"||v==="solved-with-hint";
    const part = v==="in-progress"||v==="attempting";
    return '<span class="pill '+(on?"pill-solid":part?"pill-steel":"pill-out")+'" title="'+esc(USERS[u].name+": "+v)+'">'+USERS[u].initial+'</span>';
  }).join("");
}
function meter(min,max){
  let s='<span class="meter" title="Difficulty '+min+(max>min?"-"+max:"")+' of 5" aria-label="Difficulty '+min+(max>min?" to "+max:"")+' of 5">';
  for(let i=1;i<=5;i++){
    const solid = i<=min, mid = i>min && i<=max;
    s += '<span class="seg'+(solid?" on":"")+'"'+(mid?' style="background:var(--steel);border-color:var(--steel)"':'')+'></span>';
  }
  return s+'</span>';
}
function resLinks(ids){
  if(!ids||!ids.length) return "";
  return ids.map(id=>{const R=res(id); if(!R) return "";
    return R.url ? '<a href="'+esc(R.url)+'" target="_blank" rel="noopener">'+id+'</a>'
                 : '<span class="tertiary" title="No verified URL">'+id+'</span>';
  }).join(" · ");
}
function probChips(ids){
  if(!ids||!ids.length) return "";
  return ids.map(id=>{const P=prob(id); return P?'<span class="pill">'+id+' · '+esc(P.source)+'</span>':"";}).join(" ");
}

/* ============================================================================
   NAV + COUNTDOWN (§2)
   ========================================================================= */
function renderNav(){
  const t=todayISO(), smcLeft=daysBetween(t,EXAMS.smc.date), preSMC = smcLeft>=0;
  const tgt=targetExam(), tgtLeft=daysBetween(t,tgt.date);
  const b=branch();
  const label = {awaiting:"Awaiting results", bmo1:"BMO1", kangaroo:"Senior Kangaroo"}[b];

  // Before 7 Oct: SMC primary, BMO1 secondary and muted. After: they swap,
  // and the chip carries the branch state.
  const chip = $("#countdownChip");
  chip.innerHTML = preSMC
    ? '<span class="t13">SMC '+smcLeft+'d</span><span class="t10 tertiary">'+(b==="kangaroo"?"SK":"BMO1")+' '+tgtLeft+'d</span>'
    : '<span class="t13">'+(b==="kangaroo"?"Kangaroo":"BMO1")+' '+Math.max(tgtLeft,0)+'d</span><span class="t10 tertiary">'+esc(label)+'</span>';
  chip.title = preSMC
    ? EXAMS.smc.name+" — "+fmtLong(EXAMS.smc.date)
    : tgt.name+" — "+fmtLong(tgt.date)+" · "+label;

  $("#userChip").textContent = USERS[State.me].initial;
  document.querySelectorAll(".navlink").forEach(b2=>{
    if(b2.dataset.route===Router.route) b2.setAttribute("aria-current","page");
    else b2.removeAttribute("aria-current");
  });
}

/* ============================================================================
   TODAY (§3.2)
   ========================================================================= */
function viewToday(){
  const t=todayISO(), me=State.me, todays=sessionOn(t);
  const v=$("#view"); v.innerHTML="";
  const grid=el("div","grid-2"); v.appendChild(grid);
  const left=el("div","stack-30"), right=el("div","stack-30");
  grid.append(left,right);

  /* -- Left: today's session ------------------------------------------- */
  const blackout=BLACKOUTS[t];
  const exam = Object.values(EXAMS).find(e=>e.date===t && (e!==EXAMS.kangaroo||branch()==="kangaroo") && (e!==EXAMS.bmo1||branch()!=="kangaroo"));

  if(exam){
    left.innerHTML = '<div class="band"><div><div class="t12 tertiary">'+fmtLong(t)+'</div>'
      + '<div class="t27" style="margin-top:var(--s6)">'+esc(exam.name)+'</div>'
      + '<div class="t13 tertiary" style="margin-top:var(--s6)">'+esc(exam.detail)+'</div></div></div>';
  } else if(!todays.length){
    // Rest days and blackouts are part of the plan, not an empty state (§3.2).
    const card=el("div","card");
    card.innerHTML = '<div class="t12 tertiary">'+fmtLong(t)+'</div>'
      + '<div class="t18" style="margin-top:var(--s10)">'+(blackout?esc(blackout):"No session scheduled")+'</div>'
      + '<p class="t13 muted" style="margin-top:var(--s10);max-width:52ch">'
      + (blackout ? "A blackout in the plan. Nothing is scheduled and nothing is owed."
                  : "Nothing is scheduled today. The gaps are deliberate — the plan runs to 18 November and rest is part of it.")
      + '</p>';
    left.appendChild(card);
  }

  todays.forEach(s=>{
    const st=sessStatus(me,s.id);
    const card=el("div","card");
    let h = '<div class="between"><div class="row">'
      + '<span class="t12 tertiary">'+s.id+'</span>'+modePill(s.mode)
      + '<span class="t12 tertiary">'+(s.min?s.min+" min":"no work")+'</span>'
      + (s.mock?'<span class="pill pill-solid">mock</span>':'')
      + '</div><span class="t12 tertiary">'+fmtLong(s.date)+'</span></div>'
      + '<h2 class="t27" style="margin-top:var(--s10)">'+esc(s.title)+'</h2>';

    if(s.crit) h += '<p class="t13 muted" style="margin-top:var(--s10)">Success: '+esc(s.crit)+'</p>';

    if(s.rest){
      h += '<p class="t16" style="margin-top:var(--s22)">'+esc(s.b[0][1])+'</p>';
    } else {
      h += '<ol class="stack-10" style="margin-top:var(--s22)">'
        + s.b.map((bl,i)=>'<li class="row" style="align-items:flex-start">'
            + '<span class="t12 tertiary" style="width:22px;flex:none">'+(i+1)+'</span>'
            + '<span class="t12 tertiary tnum" style="width:50px;flex:none">'+bl[0]+' min</span>'
            + '<span class="t14">'+esc(bl[1])+'</span></li>').join("")
        + '</ol>';
    }
    const links=[resLinks(s.res), probChips(s.probs)].filter(Boolean).join(" &nbsp; ");
    if(links) h += '<div class="row" style="margin-top:var(--s22);flex-wrap:wrap">'+links+'</div>';
    if(s.tech && s.tech.length)
      h += '<p class="t12 tertiary" style="margin-top:var(--s10)">Introduces '+s.tech.map(x=>x+" "+tech(x).name).join(", ")+'</p>';
    if(s.review && s.review.length)
      h += '<p class="t12 tertiary" style="margin-top:var(--s10)">Reviews '+s.review.join(", ")+'</p>';

    card.innerHTML=h;
    const bar=el("div","row"); bar.style.marginTop="var(--s34)";
    if(s.rest){
      const b1=el("button","btn-primary", st==="done"?"Rested ✓":"Mark rested");
      b1.onclick=()=>{setSessionStatus(me,s.id,st==="done"?"not-started":"done");};
      bar.appendChild(b1);
    } else {
      const start=el("button","btn-primary", st==="done"?"Run again":"Start session");
      start.onclick=()=>Runner.open(s.id);
      bar.appendChild(start);
      const mark=el("button","btn-ghost", st==="done"?"Mark not done":"Mark done");
      mark.onclick=()=>{setSessionStatus(me,s.id,st==="done"?"not-started":"done");};
      bar.appendChild(mark);
      bar.appendChild(el("span","t12 tertiary", st==="done"?"Completed":st==="in-progress"?"In progress":"Not started"));
    }
    card.appendChild(bar);
    left.appendChild(card);
  });

  /* -- Left: rest of the week as compact checklist rows ------------------ */
  const wk = todays.length ? weekOf(todays[0].w) : WEEKS.find(w=>t>=w.start && t<=w.end);
  if(wk){
    const rest = SESSIONS.filter(s=>s.w===wk.n && s.date>t);
    const box=el("div","stack-10");
    const wkHead=el("div","between");
    const wkLeft=el("div","row");
    wkLeft.innerHTML='<span class="t12 tertiary caps">Week '+wk.n+' — '+esc(wk.theme)+'</span>';
    const how=el("button","btn-link","How this works");
    how.onclick=()=>Guide.show();
    wkLeft.appendChild(how);
    wkHead.appendChild(wkLeft);
    wkHead.appendChild(el("span","t12 tertiary", fmt(wk.start)+" – "+fmt(wk.end)));
    box.appendChild(wkHead);
    if(rest.length){
      rest.forEach(s=>{
        const r=el("div","lrow"); r.style.gridTemplateColumns="64px 60px 1fr 64px auto";
        r.innerHTML = '<span class="t12 tertiary">'+dow(s.date)+" "+fmt(s.date)+'</span>'
          + modePill(s.mode)
          + '<span class="t13 ltitle">'+esc(s.title)+'</span>'
          + '<span class="t12 tertiary tnum">'+(s.min?s.min+" min":"—")+'</span>'
          + '<span class="row">'+hsChips(u=>sessStatus(u,s.id))+'</span>';
        box.appendChild(r);
      });
    } else {
      box.appendChild(el("p","t13 tertiary","Nothing further scheduled this week."));
    }
    left.appendChild(box);
  }

  /* -- Right: countdown, techniques due, the other student -------------- */
  const cd=el("div","card");
  const smcLeft=daysBetween(t,EXAMS.smc.date), tgt=targetExam(), tgtLeft=daysBetween(t,tgt.date);
  const primary = smcLeft>=0 ? {n:smcLeft, e:EXAMS.smc} : {n:tgtLeft, e:tgt};
  const secondary= smcLeft>=0 ? {n:tgtLeft, e:tgt} : null;
  cd.innerHTML = '<div class="t12 tertiary caps">'+(primary.n<0?"Sat":"Days to")+'</div>'
    + '<div class="display" style="margin-top:var(--s6)">'+Math.abs(primary.n)+'</div>'
    + '<div class="t13" style="margin-top:var(--s6)">'+esc(primary.e.name)+'</div>'
    + '<div class="t12 tertiary">'+fmtLong(primary.e.date)+'</div>'
    + (secondary ? '<div class="rule" style="margin:var(--s22) 0"></div>'
        + '<div class="between"><span class="t12 tertiary">'+esc(secondary.e.name)+'</span>'
        + '<span class="t13 tertiary tnum">'+secondary.n+'d</span></div>' : "")
    + (smcLeft<0 ? '<div class="rule" style="margin:var(--s22) 0"></div>'+branchControl() : "");
  right.appendChild(cd);

  const due=techDueToday(me);
  const tb=el("div","card");
  tb.innerHTML='<div class="t12 tertiary caps">Techniques due today</div>';
  if(due.length){
    const list=el("div","stack-6"); list.style.marginTop="var(--s22)";
    due.forEach(T=>{
      const st=techState(me,T.id);
      const row=el("div","between");
      row.innerHTML='<span class="t13">'+T.id+' '+esc(T.name)+'</span>'
        + '<span class="pill'+(st==="overdue"?" pill-solid":"")+'">'+st+'</span>';
      list.appendChild(row);
    });
    tb.appendChild(list);
    const go=el("button","btn-link","Open technique tracker →");
    go.style.marginTop="var(--s22)"; go.onclick=()=>openDrawer("techniques");
    tb.appendChild(go);
  } else {
    tb.appendChild(el("p","t13 tertiary","Nothing due.")).style.marginTop="var(--s22)";
  }
  right.appendChild(tb);

  if(todays.length){
    const o=other(me), ob=el("div","card");
    ob.innerHTML='<div class="t12 tertiary caps">'+esc(USERS[o].name)+' today</div>'
      + todays.map(s=>{
          const st=sessStatus(o,s.id);
          return '<div class="between" style="margin-top:var(--s22)"><span class="t13">'+s.id+'</span>'
            + '<span class="pill'+(st==="done"?" pill-solid":st==="in-progress"?" pill-steel":" pill-out")+'">'
            + (st==="done"?"done":st==="in-progress"?"in progress":"not started")+'</span></div>';
        }).join("");
    right.appendChild(ob);
  }
  right.appendChild(storeNotice());
}

function branchControl(){
  return '<div class="t12 tertiary caps">Which paper on 18 Nov</div>'
    + '<div class="tri" style="margin-top:var(--s10)" id="branchTri">'
    + [["awaiting","Awaiting"],["bmo1","BMO1"],["kangaroo","Kangaroo"]]
        .map(([v,l])=>'<button data-branch="'+v+'" aria-pressed="'+(branch()===v)+'">'+l+'</button>').join("")
    + '</div><p class="t12 tertiary" style="margin-top:var(--s10)">Both fall on 18 Nov. Only one can be sat.</p>';
}

function setSessionStatus(u,id,status){
  const S=State.student[u].sessions;
  S[id]=Object.assign(S[id]||{}, {status, at:status==="done"?todayISO():null});
  if(status==="done"){ const s=session(id); State.student[u].hours[id]=s?s.min:0; }
  else delete State.student[u].hours[id];
  saveMe(); render();
}

function storeNotice(){
  const n=el("div","");
  if(State.mode==="db") return n;
  n.className="card";
  n.innerHTML='<div class="t12 tertiary caps">Storage</div>'
    +'<p class="t13 muted" style="margin-top:var(--s10)">Running in memory. Progress will not survive a reload and is not shared between the two of you. '
    +'Shared persistence needs the <code>db</code> capability, which is granted when this page is published as an Artifact.</p>';
  return n;
}

   CALENDAR (§3.3)
   Vertical agenda is the default; month grid is a toggle. Blackouts appear
   struck through rather than omitted — the gaps in the plan should be visible.

let calView="agenda";

function viewCalendar(){
  const v=$("#view"); v.innerHTML="";
  const head=el("div","between");
  head.innerHTML='<h1 class="t27">Calendar</h1>';
  const tail=el("div","row");
  const toggle=el("div","tri"); toggle.style.width="200px";
  [["agenda","Agenda"],["month","Month"]].forEach(([k,l])=>{
    const b=el("button",null,l); b.setAttribute("aria-pressed", String(calView===k));
    b.onclick=()=>{calView=k; render();}; toggle.appendChild(b);
  });
  tail.appendChild(toggle);
  // The one filled action on this screen: the agenda runs 3 Sep - 18 Nov and
  // opens at week 0, so getting back to today is the thing you actually want.
  const jump=el("button","btn-primary","Jump to today");
  jump.onclick=()=>{
    const n=document.getElementById("todayRow");
    if(n) n.scrollIntoView({block:"center", behavior:"smooth"});
  };
  tail.appendChild(jump);
  head.appendChild(tail);
  v.appendChild(head);
  const body=el("div"); body.style.marginTop="var(--s30)"; v.appendChild(body);
  calView==="agenda" ? renderAgenda(body) : renderMonths(body);
}

function renderAgenda(root){
  const t=todayISO();
  let phaseIx=0;
  WEEKS.forEach(w=>{
    // Phase boundary rules fall inside the agenda where the phase starts.
    while(phaseIx<PHASES.length && PHASES[phaseIx].start<=w.end){
      const p=PHASES[phaseIx];
      if(p.start>=w.start){
        const ph=el("div","phase");
        ph.innerHTML='<div class="rule"></div><span>'+esc(p.label)+'</span><div class="rule"></div>';
        root.appendChild(ph);
      }
      phaseIx++;
    }
    const grp=el("section"); grp.style.marginTop="var(--s30)";
    grp.innerHTML='<div class="between" style="padding:0 var(--s22) var(--s10)">'
      + '<div class="row"><span class="t18">Week '+w.n+'</span>'
      + '<span class="t13 muted">'+esc(w.theme)+'</span>'
      + (w.light?'<span class="pill">consolidation</span>':'')+'</div>'
      + '<div class="row"><span class="t12 tertiary">'+fmt(w.start)+" – "+fmt(w.end)+'</span>'
      + (w.checkpoint?'<span class="pill">'+esc(w.checkpoint)+'</span>':'')+'</div></div>';

    const list=el("div","stack-6");
    // Walk every calendar day in the week so blackouts and exams show through.
    for(let x=d(w.start); x<=d(w.end); x.setDate(x.getDate()+1)){
      const iso=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
      const exam=examOn(iso);
      if(exam){
        const b=el("div","band");
        if(iso===t) b.id="todayRow";
        b.innerHTML='<div><div class="t12 tertiary">'+fmtLong(iso)+'</div>'
          +'<div class="t18" style="margin-top:var(--s4)">'+esc(exam.name)+'</div></div>'
          +'<div class="t12 tertiary" style="text-align:right;max-width:40%">'+esc(exam.detail)+'</div>';
        list.appendChild(b);
        continue;
      }
      const ss=sessionOn(iso);
      if(ss.length){ ss.forEach(s=>list.appendChild(agendaRow(s,iso,t))); continue; }
      if(BLACKOUTS[iso]){
        const r=el("div","lrow blackout"); r.style.gridTemplateColumns="120px 1fr auto";
        if(iso===t) r.id="todayRow";
        r.innerHTML='<span class="t12">'+dow(iso)+" "+fmt(iso)+'</span>'
          +'<span class="t13 ltitle">'+esc(BLACKOUTS[iso])+'</span>'
          +'<span class="t12">blackout</span>';
        list.appendChild(r);
      }
    }
    grp.appendChild(list);
    root.appendChild(grp);
  });
}

function agendaRow(s,iso,t){
  const r=el("div","lrow");
  r.style.gridTemplateColumns="120px 64px 1fr 70px auto";
  if(iso===t){ r.style.borderColor="var(--blue)"; r.id="todayRow"; }
  r.innerHTML='<span class="t12 tertiary">'+dow(iso)+" "+fmt(iso)+'</span>'
    + modePill(s.mode)
    + '<span class="t13 ltitle">'+esc(s.title)+(s.mock?' <span class="pill pill-solid">mock</span>':'')+'</span>'
    + '<span class="t12 tertiary tnum">'+(s.min?s.min+" min":"—")+'</span>'
    + '<span class="row">'+hsChips(u=>sessStatus(u,s.id))+'</span>';
  r.style.cursor="pointer";
  r.onclick=()=>Runner.open(s.id);
  return r;
}

function examOn(iso){
  if(iso===EXAMS.smc.date) return EXAMS.smc;
  if(iso===EXAMS.bmo1.date) return branch()==="kangaroo" ? EXAMS.kangaroo : EXAMS.bmo1;
  return null;
}

function renderMonths(root){
  const t=todayISO();
  [[2026,8],[2026,9],[2026,10]].forEach(([y,m])=>{
    const sec=el("section"); sec.style.marginTop="var(--s30)";
    sec.innerHTML='<div class="t18" style="padding:0 var(--s22) var(--s10)">'+MON[m]+' 2026</div>';
    const g=el("div"); g.style.cssText="display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s6)";
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(dn=>{
      const h=el("div","t10 tertiary caps",dn); h.style.padding="0 var(--s6) var(--s4)"; g.appendChild(h);
    });
    const first=new Date(y,m,1), lead=(first.getDay()+6)%7;   // Monday-first
    for(let i=0;i<lead;i++) g.appendChild(el("div"));
    const days=new Date(y,m+1,0).getDate();
    for(let dd=1; dd<=days; dd++){
      const iso=y+"-"+String(m+1).padStart(2,"0")+"-"+String(dd).padStart(2,"0");
      const cell=el("div","lrow"); cell.style.cssText="display:block;min-height:78px;padding:var(--s10)";
      const exam=examOn(iso), ss=sessionOn(iso);
      if(exam){ cell.style.background="var(--ink)"; cell.style.borderColor="var(--ink)"; cell.style.color="var(--surface)"; }
      else if(BLACKOUTS[iso]){ cell.style.background="transparent"; cell.style.borderStyle="dashed"; }
      if(iso===t){ cell.style.borderColor="var(--blue)"; cell.id="todayRow"; }
      let h='<div class="t12'+(exam?"":" tertiary")+'">'+dd+'</div>';
      if(exam) h+='<div class="t10" style="margin-top:var(--s4)">'+(exam===EXAMS.smc?"SMC":exam===EXAMS.kangaroo?"Kangaroo":"BMO1")+'</div>';
      ss.forEach(s=>{ h+='<div class="t10'+(exam?"":" muted")+'" style="margin-top:var(--s4)">'+s.id+(s.mock?" ·mock":"")+'</div>'; });
      if(!ss.length && BLACKOUTS[iso]) h+='<div class="t10 tertiary" style="margin-top:var(--s4)">—</div>';
      cell.innerHTML=h;
      if(ss.length){ cell.style.cursor="pointer"; cell.onclick=()=>Runner.open(ss[0].id); }
      g.appendChild(cell);
    }
    sec.appendChild(g); root.appendChild(sec);
  });
}

/* ============================================================================
   SESSION RUNNER (§3.4)
   Focused mode. Nav recedes; this screen returns to full Augen Pro spacing.
   One block at a time, centred, max 700px.
   The attempt clock is the point of the screen: for problem blocks the hint
   control stays VISIBLE but disabled, counting down, so the student can see
   they are meant to keep struggling (plan §13 — "looking at solutions too
   early" is a named failure mode).
   ========================================================================= */
const Runner = {
  s:null, i:0, left:0, running:false, tick:null,
  attemptLeft:0, attemptRunning:false, hintTaken:false,

  open(id){
    const s=session(id); if(!s) return;
    this.s=s; this.i=0; this.hintTaken=false;
    this.load(0);
    setSessionStatus(State.me, id, sessStatus(State.me,id)==="done" ? "done" : "in-progress");
    $("#runner").classList.remove("hidden");
    document.body.style.overflow="hidden";
    this.draw();
  },
  close(){
    this.stop(); this.s=null;
    $("#runner").classList.add("hidden");
    document.body.style.overflow="";
    render();
  },
  load(i){
    this.i=i; this.left=(this.s.b[i][0]||0)*60; this.running=false;
    // Minimum attempt time applies to any block that names a problem source.
    const mins=this.minAttempt();
    this.attemptLeft = mins*60; this.attemptRunning=false; this.hintTaken=false;
  },
  minAttempt(){
    const s=this.s, txt=(s.b[this.i][1]||"");
    // An explicit "45 min minimum" in the plan's own wording always wins.
    const m=txt.match(/(\d+)\s*min(?:ute)?s?\s*minimum/i);
    if(m) return parseInt(m[1],10);
    if(!(s.probs && s.probs.length)) return 0;
    // Otherwise the paper's minimum applies only to blocks that are actually
    // an attempt. Marking, presenting and admin blocks are not — locking
    // hints for 90 minutes on "look at the answer sheet" would be nonsense.
    // Judged on the block's OPENING verb, not on any occurrence of the word:
    // "…strict conditions. Do not mark it." is an attempt block, not a
    // marking block.
    const head=txt.trim();
    if(/^(mark|present|debrief|create|recap|review|rest|swap|chase|compare|read R\d)/i.test(head)) return 0;
    if(/no solving|cold read/i.test(txt)) return 0;
    // If the plan's own instruction sanctions hints for this block, never
    // lock them — S006's "hints before solutions" is the point of the block.
    if(/hints? before|with hints?|video hints?/i.test(txt)) return 0;
    if(!/\b(problems?|papers?|attempts?|timed|questions?|mocks?|Kangaroo|Maclaurin|conditions)\b/i.test(txt)) return 0;
    return Math.min.apply(null, s.probs.map(p=>(prob(p)||{}).minAttempt||45));
  },
  start(){
    if(this.running) return;
    this.running=true;
    if(this.minAttempt()>0) this.attemptRunning=true;
    this.tick=setInterval(()=>{
      this.left--;
      if(this.attemptRunning && this.attemptLeft>0) this.attemptLeft--;
      this.paint();
    },1000);
    this.paint();
  },
  stop(){ this.running=false; this.attemptRunning=false; clearInterval(this.tick); this.tick=null; },
  pause(){ this.stop(); this.paint(); },
  next(){
    this.stop();
    if(this.i < this.s.b.length-1){ this.load(this.i+1); this.draw(); }
    else { setSessionStatus(State.me, this.s.id, "done"); this.close(); }
  },
  skip(){ this.stop(); if(this.i < this.s.b.length-1){ this.load(this.i+1); this.draw(); } else this.close(); },

  /* The panel is rebuilt only when the block changes. Per-tick updates are
     painted in place, so the 72px ring keeps its 1s transition instead of
     being recreated at its destination value every second. */
  draw(){ this.render(); },

  render(){
    const s=this.s; if(!s) return;
    const r=$("#runner"), blk=s.b[this.i], total=s.b.length;
    const sumMin=s.b.reduce((a,b)=>a+(b[0]||0),0);
    const mismatch = sumMin!==s.min;
    const mins=this.minAttempt();

    let h='<div class="runnertop">'
      + '<div class="row"><span class="t12 tertiary">'+s.id+'</span>'+modePill(s.mode)
      + '<span class="t13">'+esc(s.title)+'</span></div>'
      + '<button class="btn-link" id="rClose">Close</button></div>'
      + '<div class="runnerbody"><div class="runnerpanel">'
      + '<div class="t12 tertiary caps">Block '+(this.i+1)+' of '+total+'</div>'
      + '<div class="display" id="rTimer" style="margin-top:var(--s22)"></div>'
      + '<p class="t16" style="margin-top:var(--s50);line-height:1.5">'+esc(blk[1])+'</p>';

    const links=[resLinks(s.res), probChips(s.probs)].filter(Boolean).join(" &nbsp; ");
    if(links) h+='<div class="row" style="justify-content:center;flex-wrap:wrap;margin-top:var(--s34)">'+links+'</div>';

    if(mins>0){
      const C=(2*Math.PI*34).toFixed(2);
      h+='<div class="attempt"><div class="between">'
        + '<div class="row" style="text-align:left">'
        + '<svg class="attemptring" viewBox="0 0 72 72" aria-hidden="true">'
        + '<g transform="rotate(-90 36 36)">'
        + '<circle class="track" cx="36" cy="36" r="34"/>'
        + '<circle class="run" id="rRing" cx="36" cy="36" r="34" stroke-linecap="round" '
        + 'stroke-dasharray="'+C+'" stroke-dashoffset="0"/></g></svg>'
        + '<div><div class="t12 tertiary caps">Attempt clock</div>'
        + '<div class="t13" id="rAttemptMsg" style="margin-top:var(--s4)"></div></div></div>'
        + '<button class="btn-ghost" id="rHint"></button></div>'
        + '<p class="t12" id="rHintNote" style="margin-top:var(--s10);color:var(--blue);text-align:left" hidden>'
        + 'Recorded as outside help — problems solved after this show a blue edge.</p>'
        + '</div>';
    }

    h+='<div class="runneractions">'
      + '<button class="btn-ghost" id="rPause"></button>'
      + '<button class="btn-primary" id="rNext">'+(this.i<total-1?"Next block":"Finish session")+'</button>'
      + '<button class="btn-link" id="rSkip">Skip block</button>'
      + '</div>';

    if(s.crit) h+='<p class="t12 tertiary" style="margin-top:var(--s50)">Success: '+esc(s.crit)+'</p>';
    if(mismatch) h+='<p class="t12 tertiary" style="margin-top:var(--s10)">Note: the plan\u2019s blocks total '+sumMin+' min against a stated '+s.min+' min for this session. Reproduced as written.</p>';

    h+='</div></div><div class="runnerfoot"><div class="segbar">'
      + s.b.map((_,ix)=>'<div class="'+(ix<this.i?"done":ix===this.i?"current":"")+'"></div>').join("")
      + '</div></div>';

    r.innerHTML=h;
    $("#rClose",r).onclick=()=>this.close();
    $("#rPause",r).onclick=()=>this.running?this.pause():this.start();
    $("#rNext",r).onclick=()=>this.next();
    $("#rSkip",r).onclick=()=>this.skip();
    const hint=$("#rHint",r);
    if(hint) hint.onclick=()=>{
      if(this.minAttempt()===0 || this.attemptLeft<=0){ this.hintTaken=true; this.paint(); }
    };
    this.paint();
  },

  paint(){
    const s=this.s; if(!s) return;
    const r=$("#runner");
    const mins=this.minAttempt(), unlocked = mins===0 || this.attemptLeft<=0;

    const timer=$("#rTimer",r);   if(timer) timer.textContent=hhmm(this.left);
    const pause=$("#rPause",r);   if(pause) pause.textContent=this.running?"Pause":"Start";

    if(mins>0){
      const msg=$("#rAttemptMsg",r);
      if(msg) msg.textContent = unlocked
        ? "Minimum "+mins+" min elapsed. Hints unlocked."
        : "Keep going. "+hhmm(this.attemptLeft)+" before hints unlock.";
      const ring=$("#rRing",r);
      if(ring){
        const C=2*Math.PI*34, frac=Math.max(0, Math.min(1, this.attemptLeft/(mins*60)));
        ring.setAttribute("stroke-dashoffset", (C*(1-frac)).toFixed(2));
        ring.classList.toggle("open", unlocked);
      }
      const hint=$("#rHint",r);
      if(hint){
        hint.textContent = this.hintTaken ? "Hint used" : unlocked ? "Use a hint" : "Locked · "+hhmm(this.attemptLeft);
        hint.disabled = !unlocked;
      }
      const note=$("#rHintNote",r);
      if(note) note.hidden = !this.hintTaken;
    }
  }
};

/* ============================================================================
   PROBLEM BANK (§3.5)
   ========================================================================= */
const PF = {source:"all", diff:"all", state:"all", unsolved:false};

function viewProblems(){
  const v=$("#view"); v.innerHTML="";
  v.innerHTML='<h1 class="t27">Problems</h1>';

  const note=el("div","card"); note.style.marginTop="var(--s22)";
  note.innerHTML='<div class="t12 tertiary caps">Why nothing is tagged by topic</div>'
    +'<p class="t13 muted" style="margin-top:var(--s10);max-width:78ch">The plan (§11) declines to tag individual BMO1 problems by topic, because its author had not read them: '
    +'“Assigning topics I have not verified would be fabrication.” That constraint is kept here — every paper reads <em>untagged</em>. '
    +'Tagging is a finite, high-value job: feed <a href="https://bmos.ukmt.org.uk/home/bmolot.pdf" target="_blank" rel="noopener">R02</a> '
    +'(every BMO problem from 1993 in one PDF) to Claude Code and tag by topic, then replace the <code>topic</code> field.</p>'
    +'<p class="t12 tertiary" style="margin-top:var(--s10)">Filename convention: <code>bmo1-2026.pdf</code> is the paper sat 19 Nov 2025 — the academic year, not the sitting date.</p>';
  v.appendChild(note);

  const fwrap=el("div","stack-10"); fwrap.style.marginTop="var(--s30)";
  const mk=(label,key,opts)=>{
    const row=el("div","row");
    row.appendChild(el("span","t10 tertiary caps",label)).style.width="70px";
    const f=el("div","filters");
    opts.forEach(([val,lab])=>{
      const b=el("button","fchip",lab);
      b.setAttribute("aria-pressed", String(PF[key]===val));
      b.onclick=()=>{PF[key]=val; render();};
      f.appendChild(b);
    });

  };
  const sources=[...new Set(PROBLEMS.map(p=>p.source.split(" ")[0]+(p.source.startsWith("Senior")?" Kangaroo":"")))];
  fwrap.appendChild(mk("Source","source",[["all","All"]].concat(sources.map(s=>[s,s]))));
  fwrap.appendChild(mk("Difficulty","diff",[["all","All"],["1","1-2"],["3","3+"]]));

  ub.setAttribute("aria-pressed", String(PF.unsolved));
  ub.onclick=()=>{PF.unsolved=!PF.unsolved; render();};
  uni.appendChild(ub);
  fwrap.appendChild(uni);
  v.appendChild(fwrap);

  const solvedish = s => s==="solved"||s==="solved-with-hint";
  const rows = PROBLEMS.filter(p=>{
    if(PF.source!=="all" && !p.source.startsWith(PF.source.split(" ")[0])) return false;
    if(PF.diff==="1" && p.diffMin>2) return false;
    if(PF.diff==="3" && p.diffMin<3) return false;
    if(PF.state!=="all" && pState(State.me,p.id)!==PF.state) return false;

function paperDetail(p){

  h+='<div class="t12 tertiary caps" style="margin-top:var(--s30)">Your state — whole paper</div>';

  const qh=el("div","t12 tertiary caps"); qh.style.marginTop="var(--s30)";

function stateSelector(current, onPick){
  const wrap=el("div"); wrap.style.cssText="display:flex;flex-wrap:wrap;gap:var(--s6);margin-top:var(--s10)";

/* Plan §10: markers pick a track first. "10−" starts at 10 and deducts;
   "0+" awards upward, typically at most 2 for nontrivial progress. */
function markOf(pr){
  if(pr.track==="10-") return Math.max(0, 10 - (pr.deductions||0));
  if(pr.track==="0+")  return Math.min(10, pr.deductions||0);
  return 0;
}

function proofPanes(pr){
  const box=el("div"); box.className="proofgrid"; box.style.marginTop="var(--s6)";

  /* ---- Left: the proof --------------------------------------------- */
  const L=el("div","card");
  L.innerHTML='<div class="t12 tertiary caps">The proof</div>';
  const title=el("input"); title.type="text"; title.value=pr.title||""; title.placeholder="Title";
  title.style.marginTop="var(--s10)";
  title.oninput=()=>{pr.title=title.value; saveShared();};
  L.appendChild(title);

  const src=el("input"); src.type="text"; src.value=pr.source||""; src.placeholder="Source — e.g. BMO1 2023 Q1";
  src.style.marginTop="var(--s6)";
  src.oninput=()=>{pr.source=src.value; saveShared();};
  L.appendChild(src);

  const ta=el("textarea"); ta.value=pr.body||""; ta.placeholder="Type the proof, or photograph handwritten work below.";
  ta.style.cssText="margin-top:var(--s10);min-height:240px";
  ta.oninput=()=>{pr.body=ta.value; saveShared();};
  L.appendChild(ta);

  const up=el("div"); up.style.marginTop="var(--s22)";
  up.innerHTML='<div class="t12 tertiary caps">Handwritten</div>';
  const file=el("input"); file.type="file"; file.accept="image/*";
  file.style.cssText="margin-top:var(--s10);font-size:12px";
  const status=el("p","t12 tertiary"); status.style.marginTop="var(--s6)";
  const imgWrap=el("div"); imgWrap.style.marginTop="var(--s10)";
  const paint=()=>{
    imgWrap.innerHTML="";
    if(pr.photo){
      const im=el("img"); im.src=pr.photo; im.alt="Handwritten proof";
      im.style.cssText="max-width:100%;border-radius:var(--r-row);border:0.5px solid var(--hair)";
      imgWrap.appendChild(im);
      const rm=el("button","btn-link","Remove photograph");
      rm.style.marginTop="var(--s6)";
      rm.onclick=()=>{pr.photo=null; saveShared(); render();};
      imgWrap.appendChild(rm);
    }
  };
  file.onchange=async ()=>{
    const f=file.files&&file.files[0]; if(!f) return;
    status.textContent="Processing…";
    try{
      const url=await downscale(f, 1000, 0.55);
      if(url.length > 200000){ status.textContent="Photograph is too large to store even after downscaling. Crop it and try again."; return; }
      pr.photo=url; saveShared(); status.textContent=""; render();
    }catch(_){ status.textContent="Could not read that image."; }
  };
  up.append(file,status,imgWrap); paint();
  L.appendChild(up);

  /* ---- Right: rubric ------------------------------------------------ */
  const R=el("div","card");
  R.innerHTML='<div class="between"><span class="t12 tertiary caps">Peer marking</span>'
    +'<span class="t12 tertiary">Marker: '+esc(USERS[State.me].name)+'</span></div>';

  RUBRIC.forEach((item,ix)=>{
    const m=(pr.marks||{})[ix]||{};
    const it=el("div","rubric-item");
    it.innerHTML='<div class="row" style="align-items:flex-start">'
      +'<span class="t12 tertiary" style="width:16px;flex:none">'+(ix+1)+'</span>'
      +'<span class="t13">'+esc(item.q)+'</span></div>'
      +'<p class="t12 tertiary" style="margin:var(--s6) 0 var(--s10) 16px">If no: '+esc(item.fail)+'</p>';
    const tri=el("div","tri"); tri.style.marginLeft="16px";
    [["yes","Yes"],["no","No"],["na","n/a"]].forEach(([val,lab])=>{
      const b=el("button",null,lab);
      b.setAttribute("aria-pressed", String(m.v===val));
      b.onclick=()=>{
        pr.marks=pr.marks||{}; pr.marks[ix]=Object.assign({},m,{v:val});
        pr.marker=State.me; saveShared(); render();
      };
      tri.appendChild(b);
    });
    it.appendChild(tri);
    const note=el("textarea"); note.value=m.note||""; note.placeholder="Note — quote the line.";
    note.style.cssText="margin:var(--s10) 0 0 16px;width:calc(100% - 16px);min-height:52px";
    note.oninput=()=>{pr.marks=pr.marks||{}; pr.marks[ix]=Object.assign({},pr.marks[ix]||{},{note:note.value}); saveShared();};
    it.appendChild(note);
    R.appendChild(it);
  });

  /* Item 6 — the track. Plan §10: say it out loud to each other. */
  const t6=el("div","rubric-item");
  t6.innerHTML='<div class="row" style="align-items:flex-start">'
    +'<span class="t12 tertiary" style="width:16px;flex:none">6</span>'
    +'<span class="t13">Which track — 10− or 0+?</span></div>'
    +'<p class="t12 tertiary" style="margin:var(--s6) 0 var(--s10) 16px">'
    +'10− is for a script that has essentially cracked it: start at 10 and deduct. '
    +'0+ is for one that has not: award upward, typically at most 2. The gap between the tracks is brutal — nearly-solving is worth about 2, solving is worth 10.</p>';
  const tri=el("div","tri"); tri.style.marginLeft="16px";
  [["10-","10− track"],["0+","0+ track"]].forEach(([val,lab])=>{
    const b=el("button",null,lab);
    b.setAttribute("aria-pressed", String(pr.track===val));
    b.onclick=()=>{pr.track=val; pr.deductions=0; saveShared(); render();};
    tri.appendChild(b);
  });
  t6.appendChild(tri);
  R.appendChild(t6);

  if(pr.track){
    const adj=el("div","rubric-item");
    const isDeduct = pr.track==="10-";
    adj.innerHTML='<div class="t12 tertiary caps">'+(isDeduct?"Deductions":"Marks awarded")+'</div>'
      +'<p class="t12 tertiary" style="margin-top:var(--s6)">'
      +(isDeduct
        ? "A single mathematical error costs about 2. Proving one direction of an “iff” costs about 3. One arithmetic slip costs nothing; two or more cost about 1."
        : "Typically at most 2 for nontrivial progress toward one part.")+'</p>';
    const row=el("div","row"); row.style.marginTop="var(--s10)";
    const minus=el("button","btn-ghost","−1"); minus.onclick=()=>{pr.deductions=Math.max(0,(pr.deductions||0)-1); saveShared(); render();};
    const plus =el("button","btn-ghost","+1"); plus.onclick =()=>{pr.deductions=Math.min(10,(pr.deductions||0)+1); saveShared(); render();};
    const val=el("span","t13 tnum", (isDeduct?"−":"+")+(pr.deductions||0));
    row.append(minus,val,plus);
    adj.appendChild(row);
    const total=el("div"); total.style.marginTop="var(--s22)";
    total.innerHTML='<div class="between"><span class="t13">Running mark</span>'
      +'<span class="display" style="font-size:27px;letter-spacing:-0.54px">'+markOf(pr)+' / 10</span></div>';
    adj.appendChild(total);
    R.appendChild(adj);
  }

  const del=el("button","btn-link","Delete this proof");
  del.style.marginTop="var(--s22)";
  del.onclick=()=>{
    State.shared.proofs=State.shared.proofs.filter(x=>x.id!==pr.id);
    openProof=null; saveShared(); render();
  };
  R.appendChild(del);

  box.append(L,R);
  return box;
}

/* Downscale a photograph so one proof fits inside a 256 KiB db document. */
function downscale(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error("read"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("decode"));
      img.onload=()=>{
        const scale=Math.min(1, maxDim/Math.max(img.width,img.height));
        const c=document.createElement("canvas");
        c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

        const rv=b.dataset.rv, TT=State.student[State.me].techniques;
        const cur=TT[T.id]||(TT[T.id]={done:[]});
        cur.done=cur.done||[];
        cur.done = cur.done.includes(rv) ? cur.done.filter(x=>x!==rv) : cur.done.concat([rv]);
        saveMe(); render(); openDrawer("techniques");
      };
    });
    list.appendChild(r);
  });
}

/* Seed the draw-in from the path's real length, so the line reveals across
   the whole animation rather than jumping in part-way. */
function primeDraw(svg){
  if(REDUCED) return;
  requestAnimationFrame(()=>{
    const path=svg.querySelector(".stroke.draw");
    if(!path) return;
    let len=0;
    try{ len=path.getTotalLength(); }catch(_){ return; }
    if(!len) return;
    path.style.strokeDasharray=len.toFixed(2);
    path.style.strokeDashoffset=len.toFixed(2);
    path.classList.remove("draw");
    void path.getBoundingClientRect();
    path.classList.add("draw");
  });
}

function mockChart(me,them){
  const W=760,H=210,PADL=34,PADR=22,PADT=22,PADB=30;
  const pts = SMC_MOCKS.map((id,i)=>({id, x:i, s:session(id)})).filter(p=>p.s);
  const X = i => PADL + (pts.length<2?0:i*(W-PADL-PADR)/(pts.length-1));
  const Y = v => PADT + (1 - v/SMC_MAX)*(H-PADT-PADB);

  const series = u => pts.map((p,i)=>({i, v:State.student[u].mocks[p.id]}))
                        .filter(p=>typeof p.v === "number");
  const mine=series(me), theirs=series(them);
  const path = arr => arr.map((p,ix)=>(ix?"L":"M")+X(p.i)+" "+Y(p.v)).join(" ");

  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("class","chart");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","SMC mock scores over time for both students. The table below carries the same numbers.");
  svg.style.marginTop="var(--s22)";

  let h="";
  // Reference lines only — no gridlines. Both numbers come from plan §1.
  [[GOLD_REF,"Gold / Kangaroo ≈ "+GOLD_REF],[TARGET_REF,"target ≈ "+TARGET_REF]].forEach(([v,lab])=>{
    h+='<line class="axis" x1="'+PADL+'" y1="'+Y(v)+'" x2="'+(W-PADR)+'" y2="'+Y(v)+'" stroke-dasharray="2 4"/>'
     + '<text x="'+(W-PADR)+'" y="'+(Y(v)-5)+'" text-anchor="end" font-size="10" fill="#8f8f8f">'+lab+'</text>';
  });
  h+='<line class="axis" x1="'+PADL+'" y1="'+Y(0)+'" x2="'+(W-PADR)+'" y2="'+Y(0)+'"/>';

  if(theirs.length){
    h+='<path class="ghost late" d="'+path(theirs)+'"/>';
    theirs.forEach(p=>{h+='<circle class="dot" cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="3" stroke="#8f8f8f"/>';});
  }
  if(mine.length){
    h+='<path class="stroke draw" d="'+path(mine)+'"/>';
    mine.forEach(p=>{
      h+='<circle class="dot" cx="'+X(p.i)+'" cy="'+Y(p.v)+'" r="4"/>'
       + '<text x="'+X(p.i)+'" y="'+(Y(p.v)-10)+'" text-anchor="middle" font-size="12" fill="#0f1012">'+p.v+'</text>';
    });
  }
  pts.forEach((p,i)=>{
    h+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="10" fill="#8f8f8f">'+p.id+'</text>';
  });
  if(!mine.length && !theirs.length){
    // Sit clear of the reference lines rather than across them.
    h+='<text x="'+(W/2)+'" y="'+(H-PADB-18)+'" text-anchor="middle" font-size="13" fill="#8f8f8f">No mock scores recorded yet</text>';
  }
  svg.innerHTML=h;
  return svg;
}
